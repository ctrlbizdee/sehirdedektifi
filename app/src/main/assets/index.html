<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Şehir Dedektifi</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f6f3;color:#213c35;font:1rem/1.5 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:1.5rem}header{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:2rem}h1{font-size:clamp(3rem,9vw,7rem);line-height:.95;letter-spacing:-.07em;margin:.3em 0;color:#23463d}p{max-width:54ch}.hero{padding:clamp(1rem,5vw,4rem);background:radial-gradient(ellipse at 100% 0,#e4efdd,#d8ede6 68%);border:1px solid #bbd3c7;border-radius:1.5rem}.cities{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem}.card{background:#fff;border:1px solid #c6d7ce;border-radius:1rem;padding:1.2rem;min-width:0}.card h3{margin:0}.card p{margin:.5rem 0 1rem}button,a.action,input,select{font:inherit;border-radius:.65rem;padding:.55rem .85rem}button,a.action{background:#dbece3;color:#213c35;font-weight:700;border:0;cursor:pointer;text-decoration:none;display:inline-block}input,select{background:#fff;color:inherit;border:1px solid #94afa3}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #426f63;outline-offset:3px}button:disabled{opacity:.65;cursor:default}.choices{display:grid;gap:.5rem}.choices button{text-align:left}.choices .correct{background:#a2e2a9}.choices .wrong{background:#f2a8a0}section{margin-top:1.5rem}.tools{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}[hidden]{display:none!important}
header .tools{margin:0}header label{display:flex;align-items:center;gap:.45rem}body{background:#edf3ea}.hero{background:#dfeadc;color:#284436}</style><main>
<header><strong id="brand">Şehir Dedektifi</strong><nav class="tools" aria-label="Oyuncu"><a class="action" id="profile-link">Profilim</a><a class="action" id="rank-link">Sıralama</a><label><span id="language-label">Dil</span> <select id="locale"><option value="tr">Türkçe</option><option value="en">English</option></select></label></nav></header>
<section id="lobby">
<div class="hero"><h1 id="title">Şehir Dedektifi</h1><p id="intro"></p></div>
<section><h2 id="city-heading"></h2>
<div class="tools"><input type="search" id="search" aria-label="Şehir ara"></div>
<div id="cities" class="cities"></div><p id="status" role="status"></p></section>
</section>
</main><script src="./game.js" defer></script></html>
